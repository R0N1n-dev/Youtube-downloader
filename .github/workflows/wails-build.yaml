name: Wails Cross-Platform Release

on:
  push:
    tags:
      - "v*" # Triggers when you push a version tag like v1.0.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: "youtube-downloader-linux"
            platform: "linux/amd64"
            os: "ubuntu-latest"
          - name: "youtube-downloader-windows"
            platform: "windows/amd64"
            os: "windows-latest"

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Linux requires specific system dependencies to compile native hooks
      - name: Install Linux Dependencies
        if: matrix.build.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      # Install the Wails CLI natively using Go
      - name: Install Wails CLI
        run: go install ://github.com

      # Build the binary explicitly using the matrix platform option
      - name: Build Wails App
        run: |
          wails build -platform ${{ matrix.build.platform }}

      # Upload using v4 without hidden internal wrappers
      - name: Upload Temporary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
